jenkins:
  systemMessage: "Hello World"
  clouds:
    - vSphere:
        instanceCap: 0
        maxOnlineSlaves: 0
        hostSelectionMode: "LEAST_LOADED"
        hostSelectionRequireCores: true
        hostSelectionRequireMemory: true
        hostSelectionRequireAvailableMemory: true
        hostWeightFreeCpuMhz: 1
        hostWeightFreeCpuPercent: 2
        hostWeightFreeMemoryMB: 3
        hostWeightFreeMemoryPercent: 4
        hostMinFreeCpuMhz: 500
        hostMinFreeCpuPercent: 10
        hostMinFreeMemoryMB: 2048
        hostMinFreeMemoryPercent: 15
        hostSelectionWaitSeconds: -1
        hostSelectionCandidatesAsString: "esx01.company.example, esx02.company.example"
        vsConnectionConfig:
          vsHost: "https://company-vsphere"
        vsDescription: "Cloud Host Selection Defaults Test vSphere"
